<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Glowby — admin</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --bg:#08070F;--surface:rgba(255,255,255,.045);--surface2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.12);--ink:#e8eaf0;--ink2:#b9bdcc;--muted:#8b90a3;
  --brand:#8A7CFF;--brand2:#C46BF2;--brand3:#57D9E0;
  --good:#4ade80;--warn:#fab219;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(140% 120% at 50% -10%, #14112A 0%, #0A0913 46%, #08070F 100%) fixed;
  color:var(--ink);font-family:"IBM Plex Sans",-apple-system,sans-serif;min-height:100vh}
a{color:var(--brand);text-decoration:none}
.shell{max-width:1060px;margin:0 auto;padding:26px 18px 80px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand{font-weight:700;font-size:1.15rem}
.brand span{background:linear-gradient(100deg,#8A7CFF 0%,#C46BF2 55%,#57D9E0 110%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.chip{font-size:.68rem;font-weight:700;color:var(--muted);border:1px solid var(--border);
  border-radius:999px;padding:2px 9px;letter-spacing:.06em}
.top .grow{flex:1}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--ink2);
  border-radius:9px;padding:7px 14px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--brand);color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
/* login */
#login{max-width:360px;margin:16vh auto 0;text-align:center}
#login h1{font-size:1.3rem;margin:0 0 6px}
#login p{color:var(--muted);font-size:.85rem;margin:0 0 18px}
#login input{width:100%;padding:.75rem 1rem;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:.95rem;font-family:"IBM Plex Mono",monospace;margin-bottom:10px}
#login input:focus{outline:none;border-color:var(--brand)}
#loginErr{color:var(--bad);font-size:.8rem;min-height:1.2em;margin-top:8px}
/* dashboard */
#dash{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.tile .k{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.tile .v{font-size:1.65rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:.72rem;color:var(--muted);margin-top:3px}
.tile .v.good{color:var(--good)} .tile .v.warn{color:var(--warn)} .tile .v.bad{color:var(--bad)}
.budget{height:6px;border-radius:999px;background:var(--surface2);margin-top:9px;overflow:hidden}
.budget i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .4s}
.budget i.hot{background:var(--warn)} .budget i.crit{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:.8rem;font-weight:700;color:var(--ink2);text-transform:uppercase;
  letter-spacing:.07em;margin:0 0 12px}
/* bar chart */
.chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:2px;padding-top:14px}
.bar{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:default}
.bar i{display:block;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;transition:filter .15s}
.bar:hover i{filter:brightness(1.35)}
.bar .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  background:#1a1d2b;border:1px solid var(--border);border-radius:8px;padding:6px 10px;
  font-size:.72rem;color:var(--ink2);white-space:nowrap;z-index:5;pointer-events:none}
.bar:hover .tip{display:block}
.bar .tip b{color:var(--ink)}
.xlab{display:flex;gap:2px;margin-top:6px}
.xlab span{flex:1;text-align:center;font-size:.62rem;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.empty{color:var(--muted);font-size:.85rem;padding:8px 0}
/* verdict distribution */
.dist{display:flex;flex-wrap:wrap;gap:8px}
.calnav{display:flex;align-items:center;gap:10px;font-weight:600}
.calnav button{background:none;border:1px solid var(--line,#2a2a3c);color:inherit;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal .dow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted,#8a86a3);text-align:center;padding-bottom:2px}
.cal .day{border:1px solid var(--line,#2a2a3c);border-radius:10px;padding:6px 6px 5px;min-height:58px;cursor:pointer;text-align:left;background:rgba(255,255,255,.02);position:relative}
.cal .day:hover{border-color:#8a7cff}
.cal .day.on{border-color:#8a7cff;box-shadow:0 0 0 1px #8a7cff inset}
.cal .day.today .n{color:#8a7cff;font-weight:700}
.cal .day.empty{visibility:hidden}
.cal .day .n{font-size:12px;color:var(--muted,#8a86a3)}
.cal .day .v{font-size:13px;font-weight:600;margin-top:4px}
.cal .day .c{font-size:11px;color:var(--muted,#8a86a3)}
.cal .day .heat{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px;background:#8a7cff;opacity:.85}
.daydetail{margin-top:14px}
.daydetail .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.daydetail .row b{font-size:18px}
.daydetail .row span{font-size:12px;color:var(--muted,#8a86a3)}
.daydetail table{width:100%;border-collapse:collapse;font-size:12.5px}
.daydetail td{padding:5px 6px;border-top:1px solid var(--line,#2a2a3c);vertical-align:top}
.daydetail td.t{max-width:60%}
.dist span{font-size:.76rem;color:var(--ink2);background:var(--surface2);border:1px solid var(--border);
  border-radius:999px;padding:4px 12px}
.dist b{color:var(--ink)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
  font-weight:600;padding:4px 8px;border-bottom:1px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--ink2);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.score-b{display:inline-block;min-width:34px;text-align:center;font-weight:700;font-size:.76rem;
  border-radius:999px;padding:1px 8px;border:1px solid}
.sg{color:var(--good);border-color:var(--good)} .sy{color:var(--warn);border-color:var(--warn)}
.sr{color:var(--bad);border-color:var(--bad)} .sn{color:var(--muted);border-color:var(--muted)}
.st{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 9px}
.st.new{background:rgba(250,178,25,.15);color:var(--warn)}
.st.reviewed{background:rgba(138,124,255,.15);color:var(--brand)}
.st.fixed{background:rgba(74,222,128,.14);color:var(--good)}
.st.rejected{background:rgba(255,255,255,.08);color:var(--muted)}
.racts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.racts button{font-size:.7rem;padding:3px 10px;border-radius:7px;border:1px solid var(--border);
  background:none;color:var(--ink2);cursor:pointer;font-family:inherit}
.racts button:hover{border-color:var(--brand);color:var(--ink)}
.rmsg{color:var(--ink);margin:2px 0 2px}
.rmeta{font-size:.7rem;color:var(--muted)}
.foot{color:var(--muted);font-size:.72rem;text-align:center;margin-top:24px}
@media(max-width:640px){.hidesm{display:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><span>Glowby</span> admin</div>
    <span class="chip" id="ver"></span>
    <div class="grow"></div>
    <button class="btn" id="refresh" style="display:none">Refresh</button>
    <button class="btn" id="logout" style="display:none">Log out</button>
  </div>

  <div id="login">
    <h1>Admin login</h1>
    <p>Sign in to open the dashboard.</p>
    <input type="text" id="userIn" placeholder="username" autocomplete="username">
    <input type="password" id="keyIn" placeholder="password" autocomplete="current-password">
    <button class="btn primary" id="keyGo" style="width:100%">Sign in</button>
    <div id="loginErr"></div>
  </div>

  <div id="dash">
    <div class="tiles" id="tiles"></div>

    <div class="card">
      <h2>Fresh checks — last 14 days</h2>
      <div id="chartWrap"></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0">Calendar — tap a day</h2>
        <div class="calnav"><button id="calPrev" type="button">‹</button><span id="calTitle"></span><button id="calNext" type="button">›</button></div>
      </div>
      <div id="cal" class="cal"></div>
      <div id="dayDetail" class="daydetail"></div>
    </div>

    <div class="card"><h2>Unique visitors by month</h2><div id="monthly" class="dist"></div></div>
<div class="card">
      <h2>Verdict distribution (all stored checks)</h2>
      <div class="dist" id="dist"></div>
    </div>

    <div class="card">
      <h2>Mistake reports</h2>
      <div id="reports"></div>
    </div>

    <div class="card">
      <h2>Recent checks</h2>
      <div style="overflow-x:auto"><table id="recent"></table></div>
    </div>

    <div class="foot">Auto-refreshes every 60s · <a href="/">back to Glowby</a></div>
  </div>
</div>

<script>
"use strict";
let KEY = sessionStorage.getItem("gbAdminKey") || "";
let timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function scoreClass(sc, state){
  if (sc == null) return "sn";
  if (sc >= 7.5) return "sg";
  if (sc >= 4.5) return "sy";
  return "sr";
}
async function loadCalendar(month){
  const el = $("cal"), title = $("calTitle"); if (!el) return;
  title.textContent = month;
  let data = { days: [] };
  try {
    const r = await fetch("/api/admin/calendar?key=" + encodeURIComponent(KEY) + "&month=" + month);
    if (r.ok) data = await r.json();
  } catch(e){}
  const days = data.days || [];
  const maxV = Math.max(1, ...days.map(x => x.visitors));
  const first = new Date(month + "-01T00:00:00");
  const lead = first.getDay(); // 0 = Sunday
  const today = new Date().toISOString().slice(0,10);
  let h = ["S","M","T","W","T","F","S"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) h += '<div class="day empty"></div>';
  days.forEach(x => {
    const n = +x.day.slice(8,10);
    const heat = Math.round(x.visitors / maxV * 100);
    h += `<button type="button" class="day${x.day===today?' today':''}" data-day="${x.day}">` +
         `<div class="n">${n}</div><div class="v">${x.visitors}</div><div class="c">${x.checks} chk · $${x.est_cost.toFixed(2)}</div>` +
         (x.visitors ? `<div class="heat" style="width:${Math.max(8,heat)}%"></div>` : "") + `</button>`;
  });
  el.innerHTML = h;
  el.querySelectorAll(".day[data-day]").forEach(b => b.onclick = () => {
    el.querySelectorAll(".day").forEach(x => x.classList.remove("on")); b.classList.add("on");
    loadDay(b.dataset.day);
  });
  $("calPrev").onclick = () => { window.__calMonth = shiftMonth(month, -1); loadCalendar(window.__calMonth); };
  $("calNext").onclick = () => { window.__calMonth = shiftMonth(month, +1); loadCalendar(window.__calMonth); };
  const dd = $("dayDetail"); if (dd && !dd.innerHTML) dd.innerHTML = '<div class="empty">Tap a day to see its unique visitors, fresh checks, spend, and what was checked.</div>';
}
function shiftMonth(m, delta){
  const d = new Date(m + "-01T00:00:00"); d.setMonth(d.getMonth() + delta);
  return d.toISOString().slice(0,7);
}
async function loadDay(day){
  const dd = $("dayDetail"); dd.innerHTML = '<div class="empty">Loading…</div>';
  let d = null;
  try {
    const r = await fetch("/api/admin/day?key=" + encodeURIComponent(KEY) + "&date=" + day);
    if (r.ok) d = await r.json();
  } catch(e){}
  if (!d){ dd.innerHTML = '<div class="empty">Could not load that day.</div>'; return; }
  const ev = d.events || {};
  let h = `<div class="row"><div><b>${d.visitors}</b><br><span>unique visitors</span></div>` +
          `<div><b>${d.checks}</b><br><span>fresh checks</span></div>` +
          `<div><b>$${(d.est_cost||0).toFixed(2)}</b><br><span>est. spend</span></div>` +
          `<div><b>${(ev.copy_result||0)+(ev.copy_link||0)+(ev.share||0)}</b><br><span>results shared/copied</span></div></div>`;
  h += `<div class="s" style="margin-bottom:6px">${esc(day)} · what was checked (${(d.stored||[]).length})</div>`;
  if (!(d.stored||[]).length) h += '<div class="empty">No checks stored that day.</div>';
  else h += "<table>" + d.stored.map(c =>
      `<tr><td class="t"><a href="/r/${encodeURIComponent(c.url_key)}" target="_blank" style="color:inherit">${esc(c.title||c.url_key)}</a></td>` +
      `<td>${esc(c.state||"")}</td><td>${c.score ?? "—"}</td><td>${c.views} views</td></tr>`).join("") + "</table>";
  dd.innerHTML = h;
}
function fmtDay(d){ // "2026-08-01" (or a timestamp) -> "8/1"
  const p = String(d).slice(0,10).split("-"); return (+p[1]) + "/" + (+p[2]);
}
function tile(k, v, sub, cls){
  return `<div class="tile"><div class="k">${k}</div>` +
    `<div class="v ${cls||""}">${v}</div>` +
    (sub ? `<div class="s">${sub}</div>` : "") + `</div>`;
}

async function load(){
  let r;
  try {
    r = await fetch("/api/admin/dashboard?key=" + encodeURIComponent(KEY));
  } catch (e) { $("loginErr").textContent = "Network error — try again."; return false; }
  if (r.status === 403){
    sessionStorage.removeItem("gbAdminKey");
    $("loginErr").textContent = "Wrong key.";
    return false;
  }
  const d = await r.json();
  render(d);
  return true;
}

function render(d){
  $("login").style.display = "none";
  $("dash").style.display = "block";
  $("logout").style.display = "inline-block";
  $("refresh").style.display = "inline-block";
  $("ver").textContent = "v" + (d.version || "?");

  const s = d.stats || {}, t = d.today || {};
  const spend = t.est_spend_usd ?? 0, budget = t.budget_usd || 10;
  const pct = Math.min(100, Math.round(spend / budget * 100));
  const pendNew = (s.reports_by_status || {}).new || 0;
  const barCls = pct >= 90 ? "crit" : pct >= 60 ? "hot" : "";

  $("tiles").innerHTML =
    tile("Visitors today", t.visitors ?? 0, "unique people (anonymous count)") +
    (() => {
      const mo = d.visitors_monthly || [];
      const thisMo = mo.length ? mo[0].unique : 0;
      const grand = mo.reduce((a, x) => a + (x.unique || 0), 0);
      return tile("Visitors this month", thisMo, "unique people (one count per person per month)") +
             tile("Visitors all-time", grand || (d.visitors_total ?? 0), grand ? "sum of monthly uniques" : "daily counts added up (monthly count starts today)");
    })() +
    tile("Total checks", d.total_checks ?? 0, "all-time, fresh checks run") +
    tile("Checks today", t.fresh_checks ?? 0, "fresh (not cached views)") +
    `<div class="tile"><div class="k">Spend today</div>` +
      `<div class="v">$${spend.toFixed(2)}</div>` +
      `<div class="s">of $${budget} daily budget</div>` +
      `<div class="budget"><i class="${barCls}" style="width:${pct}%"></i></div></div>` +
    tile("Checks stored", s.checks_stored ?? 0, "all-time, cached + shareable") +
    tile("Total views", s.total_views ?? 0, "incl. cache hits + share links") +
    tile("Avg video check", s.avg_check_seconds != null ? s.avg_check_seconds + "s" : "—", "videos only — no typed, no cached") +
    (() => {
      const views = s.total_views ?? 0, stored = s.checks_stored ?? 0;
      const hitPct = views > 0 ? Math.round((views - stored) / views * 100) : 0;
      return tile("Cache hit rate", hitPct + "%", "views answered free from cache · resets after " + (d.cache_ttl_days ?? 7) + " days");
    })() +
    tile("Results copied", (d.events?.copy_result?.total ?? 0), ((d.events?.copy_result?.today ?? 0) + " today")) +
    tile("Links copied", (d.events?.copy_link?.total ?? 0), ((d.events?.copy_link?.today ?? 0) + " today")) +
    tile("New reports", pendNew, "awaiting your review", pendNew > 0 ? "warn" : "good");

  // ---- 14-day bar chart (single series: checks; spend in tooltip) ----
  const daily = d.daily || [];
  if (!daily.length){
    $("chartWrap").innerHTML = '<div class="empty">No daily data yet.</div>';
  } else {
    const max = Math.max(1, ...daily.map(x => x.checks));
    let bars = '<div class="chart">', labs = '<div class="xlab">';
    daily.forEach(x => {
      const h = Math.round(x.checks / max * 100);
      bars += `<div class="bar"><span class="tip"><b>${x.checks}</b> checks · ${x.visitors ?? 0} visitors · $${x.est_cost.toFixed(2)}<br>${esc(x.day)}</span>` +
              `<i style="height:${h}%"></i></div>`;
      labs += `<span>${fmtDay(x.day)}</span>`;
    });
    $("chartWrap").innerHTML = bars + "</div>" + labs + "</div>";
  }

  // ---- calendar (click a day for its visitors / checks / spend) ----
  if (!window.__calMonth) window.__calMonth = new Date().toISOString().slice(0,7);
  loadCalendar(window.__calMonth);

  // ---- unique visitors by month ----
  const mo = d.visitors_monthly || [];
  const moEl = $("monthly");
  if (moEl) moEl.innerHTML = mo.length
    ? mo.map(x => `<span>${esc(x.month)} <b>${x.unique}</b></span>`).join("")
    : '<div class="empty">Monthly counting started with this version — first numbers appear today.</div>';

  // ---- verdict distribution ----
  const dist = s.verdict_distribution || {};
  $("dist").innerHTML = Object.keys(dist).length
    ? Object.entries(dist).map(([k, v]) => `<span>${esc(k)} <b>${v}</b></span>`).join("")
    : '<div class="empty">Nothing stored yet.</div>';

  // ---- reports ----
  const reps = d.reports || [];
  $("reports").innerHTML = !reps.length
    ? '<div class="empty">No mistake reports yet. When a user hits “report” on a check, it appears here.</div>'
    : reps.map(rp => {
      const link = rp.url_key ? `<a href="/r/${encodeURIComponent(rp.url_key)}" target="_blank">open check ↗</a>` : "";
      const acts = rp.status === "new" || rp.status === "reviewed"
        ? `<div class="racts">
            <button onclick="resolveRep(${rp.id},'reviewed')">mark reviewed</button>
            <button onclick="resolveRep(${rp.id},'fixed')">mark fixed</button>
            <button onclick="resolveRep(${rp.id},'rejected')">reject</button>
          </div>` : "";
      return `<div style="padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)">
        <span class="st ${esc(rp.status)}">${esc(rp.status)}</span>
        <div class="rmsg">${esc(rp.message)}</div>
        <div class="rmeta">#${rp.id} · ${esc((rp.created_at||"").slice(0,16).replace("T"," "))}` +
        (rp.contact ? ` · ${esc(rp.contact)}` : "") + (link ? " · " + link : "") +
        (rp.resolution ? `<br>resolution: ${esc(rp.resolution)}` : "") + `</div>${acts}</div>`;
    }).join("");

  // ---- recent checks ----
  const rec = d.recent || [];
  $("recent").innerHTML = !rec.length
    ? '<tr><td class="empty">No checks stored yet.</td></tr>'
    : "<tr><th>Score</th><th>Title</th><th class='hidesm'>Views</th>" +
      "<th class='hidesm'>Time</th><th class='hidesm'>When</th></tr>" +
      rec.map(c => {
        const badge = c.answer
          ? '<span class="score-b sn">A</span>'
          : `<span class="score-b ${scoreClass(c.score, c.state)}">${c.score != null ? c.score.toFixed(1) : "—"}</span>`;
        return `<tr><td class="num">${badge}</td>` +
          `<td><a href="/r/${encodeURIComponent(c.url_key)}" target="_blank">${esc(c.title)}</a></td>` +
          `<td class="num hidesm">${c.hits ?? ""}</td>` +
          `<td class="num hidesm">${c.seconds != null ? Math.round(c.seconds) + "s" : ""}</td>` +
          `<td class="num hidesm">${esc((c.created_at||"").slice(5,16).replace("T"," "))}</td></tr>`;
      }).join("");
}

async function resolveRep(id, status){
  let note = "";
  if (status !== "reviewed"){
    note = prompt(status === "fixed"
      ? "What was fixed? (stored as the resolution)"
      : "Why rejected? (stored as the resolution)") || "";
  }
  await fetch("/api/admin/resolve", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({key: KEY, report_id: id, status: status, note: note}),
  });
  load();
}

$("keyGo").onclick = async () => {
  const user = $("userIn").value.trim(), pass = $("keyIn").value;
  if (!pass){ $("loginErr").textContent = "Enter the password."; return; }
  $("loginErr").textContent = "";
  let r;
  try {
    r = await fetch("/api/admin/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: user, password: pass}),
    });
  } catch (e) { $("loginErr").textContent = "Network error — try again."; return; }
  if (!r.ok){ $("loginErr").textContent = "Wrong username or password."; return; }
  const d = await r.json();
  KEY = d.token;
  if (await load()){
    sessionStorage.setItem("gbAdminKey", KEY);
    startTimer();
  }
};
$("keyIn").addEventListener("keydown", e => { if (e.key === "Enter") $("keyGo").click(); });
$("userIn").addEventListener("keydown", e => { if (e.key === "Enter") $("keyIn").focus(); });
$("logout").onclick = () => {
  sessionStorage.removeItem("gbAdminKey");
  location.reload();
};
$("refresh").onclick = () => load();

function startTimer(){
  if (timer) clearInterval(timer);
  timer = setInterval(load, 60000);
}

if (KEY) load().then(ok => { if (ok) startTimer(); });
</script>
</body>
</html>
