name: Glowby certification suite
on:
  push:
  pull_request:
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium
      - name: Golden-set matrix
        run: python tests/test_final_matrix.py
      - name: Scoring caps
        run: python tests/test_cap.py
      - name: UI contract
        run: python tests/test_ui_shapes.py
